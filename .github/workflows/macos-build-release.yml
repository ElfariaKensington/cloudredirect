name: macOS Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub release and publish the macOS ZIP
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CloudRedirect for macOS
    runs-on: macos-14
    steps:
      - name: Check out macOS branch
        uses: actions/checkout@v4
        with:
          ref: macos

      - name: Build app and ZIP
        run: ./scripts/macos/build.sh

      - name: Generate release identifiers
        id: release
        shell: bash
        run: |
          DATE="$(date -u +'%Y.%m.%d')"
          BUILD="$(printf '%04d' "$GITHUB_RUN_NUMBER")"
          echo "tag=macos-${DATE}.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "name=CloudRedirect for macOS ${DATE//./-} (Build ${BUILD})" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudRedirect-macOS-arm64
          path: out/CloudRedirect-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" \
            out/CloudRedirect-macOS-arm64.zip \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes
